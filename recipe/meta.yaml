{% set name = "skfolio" %}
{% set version = "1.3.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b072fe7f3f2e9bd67a46ed8b4e181753145303ade52f828655c105aa08fcd8bb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.24.0
    - scipy >=1.15.2
    - pandas >=2.1.0
    - cvxpy-base >=1.5.0
    - clarabel >=0.10.0
    - scikit-learn >=1.6.0
    - joblib >=1.3.2
    - plotly >=6.0.0

test:
  imports:
    - skfolio
  requires:
    - pip
    - python {{ python_min }}
  # Not working with cvxpy
  # commands:
  #   - pip check

about:
  home: https://github.com/skfolio/skfolio
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python library for portfolio optimization built on top of scikit-learn
  description: Python library for portfolio optimization built on top of scikit-learn
  dev_url: https://github.com/skfolio/skfolio

extra:
  recipe-maintainers:
    - timkpaine
