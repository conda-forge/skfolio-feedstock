schema_version: 1

context:
  name: skfolio
  version: "1.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2bc7a997c5d9a800e777af38c5b928d6b7f28221f89b3fc75344c2f9099d494f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.24.0
    - scipy >=1.15.2
    - pandas >=2.1.0
    - cvxpy-base >=1.5.0
    - clarabel >=0.10.0
    - scikit-learn >=1.6.0
    - joblib >=1.3.2
    - plotly >=6.0.0

tests:
  - python:
      imports:
        - skfolio
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python library for portfolio optimization built on top of scikit-learn
  description: Python library for portfolio optimization built on top of scikit-learn
  homepage: https://github.com/skfolio/skfolio
  repository: https://github.com/skfolio/skfolio

extra:
  recipe-maintainers:
    - timkpaine
